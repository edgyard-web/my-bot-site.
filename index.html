<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --tg-bg: #1a1b1e; --primary: #0088cc; --gold: #ffeb3b; }
        body { background: var(--tg-bg); color: white; font-family: sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; padding: 15px; display: flex; justify-content: space-between; background: #111; border-bottom: 1px solid #333; box-sizing: border-box; }
        
        .instruction { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin: 15px; border-left: 4px solid var(--primary); font-size: 14px; }

        .video-frame { 
            width: calc(100% - 30px); aspect-ratio: 16/9; background: #000; 
            border-radius: 15px; overflow: hidden; border: 2px solid #333; 
        }
        #video-player { width: 100%; height: 100%; }

        .timer-display { font-size: 50px; font-weight: bold; color: var(--gold); margin: 20px 0; display: none; }
        .reward-info { color: #888; font-size: 12px; margin-bottom: 10px; }

        .btn-next { background: #333; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold;">UVIEW PRO</div>
    <div style="color:var(--gold)">💰 <span id="coin-count">0</span></div>
</div>

<div class="instruction" id="instr">
    <b>Инструкция:</b><br>
    1. Нажми на логотип YouTube или кнопку Play в центре.<br>
    2. Если звука нет — нажми на динамик в самом видео.<br>
    3. Таймер на <b>180 сек</b> пойдет после старта!
</div>

<div class="video-frame">
    <div id="video-player"></div>
</div>

<div id="timer" class="timer-display">180</div>
<div id="reward-text" class="reward-info">Награда: +150 монет</div>

<button class="btn-next" id="next-btn" onclick="location.reload()">Пропустить / Другое</button>

<script>
    const S_URL = "https://itmwgzryoeeehymbyrdz.supabase.co", 
          S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0bXdnenJ5b2VlZWh5bWJ5cmR6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODY2NzcxNywiZXhwIjoyMDg0MjQzNzE3fQ.YJNdFs468N3vIqzvEfQPzg_jAGXsx-rN8YDMqQX793g", 
          sb = supabase.createClient(S_URL, S_KEY), tg = window.Telegram.WebApp;

    let userId = tg.initDataUnsafe?.user?.id?.toString() || "u_test", 
        vids = [], curr = 0, player, timerId, timeLeft = 180;

    async function boot() {
        tg.expand();
        let { data: p } = await sb.from('profiles').select('coins').eq('user_id', userId).single();
        document.getElementById('coin-count').innerText = p ? p.coins : 500;
        
        let { data: v } = await sb.from('videos').select('*');
        vids = (v || []).filter(item => (item.views_done || 0) < item.views_needed);
        
        if (vids.length > 0) {
            loadYT();
        } else {
            document.getElementById('instr').innerText = "Видео закончились! Приходите позже.";
        }
    }

    function loadYT() {
        player = new YT.Player('video-player', {
            videoId: vids[curr].youtube_id,
            playerVars: { 
                'autoplay': 0, 
                'controls': 1, 
                'playsinline': 1, // Важно для iPhone
                'rel': 0 
            },
            events: {
                'onStateChange': onStateChange
            }
        });
    }

    function onStateChange(event) {
        // Статус 1 — это когда видео реально начало играть
        if (event.data == YT.PlayerState.PLAYING) {
            startTimer();
            document.getElementById('instr').style.display = 'none';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('next-btn').style.display = 'none';
        }
        // Если видео на паузе
        if (event.data == YT.PlayerState.PAUSED) {
            tg.showAlert("Пожалуйста, не ставьте на паузу!");
        }
    }

    function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
            // Проверяем, что видео всё еще играет
            if (player && player.getPlayerState() === 1) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    finish();
                }
            }
        }, 1000);
    }

    async function finish() {
        const currentCoins = parseInt(document.getElementById('coin-count').innerText);
        await sb.from('profiles').update({ coins: currentCoins + 150 }).eq('user_id', userId);
        await sb.from('videos').update({ views_done: (vids[curr].views_done || 0) + 1 }).eq('id', vids[curr].id);
        tg.showAlert("Просмотр завершен! +150 монет.");
        location.reload();
    }

    function onYouTubeIframeAPIReady() { boot(); }
</script>

</body>
</html>
