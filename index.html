<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-bg: #1a1b1e; --primary: #0088cc; --gold: #ffeb3b; --red: #ff4444; }
        body { background: var(--tg-bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; align-items: center; }
        
        .header { width: 100%; padding: 15px; display: flex; justify-content: space-between; background: #111; border-bottom: 1px solid #333; box-sizing: border-box; }
        
        .card { background: #25262b; margin: 20px; padding: 20px; border-radius: 20px; width: calc(100% - 40px); box-sizing: border-box; text-align: center; border: 1px solid #333; }

        .thumbnail { width: 100%; border-radius: 12px; margin-bottom: 15px; display: block; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 20px; border-radius: 15px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; }
        
        .btn-verify { background: #4caf50; display: none; margin-top: 15px; }

        .timer-big { font-size: 60px; font-weight: bold; color: var(--gold); margin: 20px 0; }
        
        .step { font-size: 14px; color: #aaa; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; text-align: left; }
        .step b { color: var(--primary); }

        .nav-bar { background: #111; display: flex; justify-content: space-around; padding: 20px 0 30px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold;">UVIEW PRO 2026</div>
    <div style="color:var(--gold)">💰 <span id="coin-count">0</span></div>
</div>

<div class="card" id="task-card">
    <img id="vid-thumb" class="thumbnail" src="" alt="Превью">
    
    <div class="step"><b>1.</b> Нажми кнопку ниже, чтобы открыть видео</div>
    <div class="step"><b>2.</b> Посмотри его 180 сек (в приложении звук ЕСТЬ)</div>
    <div class="step"><b>3.</b> Вернись сюда, чтобы забрать награду</div>

    <a id="yt-link" class="btn-main" onclick="startTask()">▶ ОТКРЫТЬ В YOUTUBE</a>
    
    <div id="timer-box" style="display:none;">
        <div class="timer-big" id="timer">180</div>
        <div style="color: #888;">Не закрывайте мини-приложение...</div>
    </div>

    <button id="claim-btn" class="btn-main btn-verify" onclick="claimReward()">💰 ЗАБРАТЬ 150 МОНЕТ</button>
</div>

<div id="no-vids" style="display:none; padding: 50px; text-align: center;">
    <h2>Все видео просмотрены!</h2>
    <p>Зайдите позже или добавьте своё видео.</p>
</div>

<div class="nav-bar">
    <div style="color:var(--primary)">🏠 ЛЕНТА</div>
    <div onclick="tg.showAlert('Магазин будет доступен после обновления')">🛒 МАГАЗИН</div>
</div>

<script>
    const S_URL = "https://itmwgzryoeeehymbyrdz.supabase.co", 
          S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0bXdnenJ5b2VlZWh5bWJ5cmR6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODY2NzcxNywiZXhwIjoyMDg0MjQzNzE3fQ.YJNdFs468N3vIqzvEfQPzg_jAGXsx-rN8YDMqQX793g", 
          sb = supabase.createClient(S_URL, S_KEY), tg = window.Telegram.WebApp;

    let userId = tg.initDataUnsafe?.user?.id?.toString() || "u_test", 
        vids = [], curr = 0, timeLeft = 180, timerId;

    async function boot() {
        tg.expand();
        let { data: p } = await sb.from('profiles').select('coins').eq('user_id', userId).single();
        document.getElementById('coin-count').innerText = p ? p.coins : 500;
        
        let { data: v } = await sb.from('videos').select('*');
        vids = (v || []).filter(item => (item.views_done || 0) < item.views_needed);
        
        if (vids.length > 0) {
            const vid = vids[curr];
            document.getElementById('vid-thumb').src = `https://img.youtube.com/vi/${vid.youtube_id}/mqdefault.jpg`;
            document.getElementById('yt-link').href = `https://www.youtube.com/watch?v=${vid.youtube_id}`;
        } else {
            document.getElementById('task-card').style.display = 'none';
            document.getElementById('no-vids').style.display = 'block';
        }
    }

    function startTask() {
        // Запускаем таймер сразу после клика по ссылке
        document.getElementById('yt-link').style.display = 'none';
        document.getElementById('timer-box').style.display = 'block';
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                document.getElementById('timer-box').style.display = 'none';
                document.getElementById('claim-btn').style.display = 'block';
                tg.HapticFeedback.notificationOccurred('success');
            }
        }, 1000);
    }

    async function claimReward() {
        const currentCoins = parseInt(document.getElementById('coin-count').innerText);
        await sb.from('profiles').update({ coins: currentCoins + 150 }).eq('user_id', userId);
        await sb.from('videos').update({ views_done: (vids[curr].views_done || 0) + 1 }).eq('id', vids[curr].id);
        tg.showAlert("Успех! +150 монет начислено.");
        location.reload();
    }

    window.onload = boot;
</script>

</body>
</html>
