<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-bg: #1a1b1e; --primary: #0088cc; --gold: #ffeb3b; --card-bg: #25262b; }
        body { background: var(--tg-bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .page { display: none; flex: 1; flex-direction: column; padding: 20px; text-align: center; box-sizing: border-box; }
        .active-page { display: flex; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; position: relative; border: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
        .btn-action { background: var(--primary); border: none; color: white; padding: 18px; border-radius: 12px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; }
        input { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #0b0c0d; color: white; box-sizing: border-box; }
        .nav-bar { background: #111; display: flex; justify-content: space-around; padding: 10px 0 25px 0; border-top: 1px solid #222; position: fixed; bottom: 0; width: 100%; }
        .nav-btn { color: #5c5f66; font-size: 10px; cursor: pointer; text-align: center; flex: 1; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold;">🤖 UVIEW AUTO</div>
        <div style="color:var(--gold)">💰 <span id="coin-count">0</span></div>
    </div>

    <div id="page-home" class="page active-page">
        <div class="video-box" id="player-container">
            <div id="player-render"></div>
            <div id="start-overlay" class="overlay" onclick="startWatching()">
                <div style="background:var(--primary); padding:15px 30px; border-radius:30px; font-weight:bold;">ЗАПУСТИТЬ ЦИКЛ ▶</div>
            </div>
        </div>
        <div id="timer-box" style="display:none; margin-top:20px;">
            <div style="font-size:40px; color:var(--gold); font-weight:bold;"><span id="seconds">180</span> сек.</div>
            <p id="status-text">Просмотр активен...</p>
        </div>
    </div>

    <div id="page-upload" class="page">
        <h3>🚀 НОВОЕ ЗАДАНИЕ</h3>
        <input type="text" id="yt-url" placeholder="Ссылка YouTube">
        <input type="number" id="v-count" value="10" placeholder="Кол-во просмотров">
        <button class="btn-action" onclick="createOrder()">ОПУБЛИКОВАТЬ</button>
    </div>

    <div class="nav-bar">
        <div class="nav-btn active" onclick="tab('home', this)">🏠 ЛЕНТА</div>
        <div class="nav-btn" onclick="tab('upload', this)">📷 ЗАГРУЗИТЬ</div>
    </div>

    <script>
        const S_URL = "https://itmwgzryoeeehymbyrdz.supabase.co", 
              S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0bXdnenJ5b2VlZWh5bWJ5cmR6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODY2NzcxNywiZXhwIjoyMDg0MjQzNzE3fQ.YJNdFs468N3vIqzvEfQPzg_jAGXsx-rN8YDMqQX793g", 
              sb = supabase.createClient(S_URL, S_KEY), tg = window.Telegram.WebApp;

        let userId = tg.initDataUnsafe?.user?.id?.toString() || "u_test", 
            vids = [], curr = 0, coins = 0, timerId;

        async function boot() {
            tg.expand();
            let { data: p } = await sb.from('profiles').select('*').eq('user_id', userId).single();
            coins = p ? p.coins : 500;
            document.getElementById('coin-count').innerText = coins;
            await reloadQueue();
        }

        async function reloadQueue() {
            let { data: v } = await sb.from('videos').select('*');
            vids = (v || []).filter(item => (item.views_done || 0) < item.views_needed);
        }

        async function startWatching() {
            if (vids.length === 0) {
                await reloadQueue();
                if (vids.length === 0) return tg.showAlert("Видео пока нет!");
            }
            
            const vid = vids[curr];
            document.getElementById('player-render').innerHTML = `
                <iframe id="yt-iframe" src="https://www.youtube.com/embed/${vid.youtube_id}?autoplay=1&mute=0&rel=0&playsinline=1" 
                allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('timer-box').style.display = 'block';

            let t = 180;
            document.getElementById('seconds').innerText = t;
            
            clearInterval(timerId);
            timerId = setInterval(async () => {
                t--;
                document.getElementById('seconds').innerText = t;
                if (t <= 0) {
                    clearInterval(timerId);
                    await processCompletion();
                }
            }, 1000);
        }

        async function processCompletion() {
            // 1. Останавливаем текущее видео (удаляем iframe)
            document.getElementById('player-render').innerHTML = "";
            document.getElementById('status-text').innerText = "Сохранение прогресса...";

            // 2. Начисляем монеты и обновляем базу
            coins += 150;
            const vidId = vids[curr].id;
            const newViews = (vids[curr].views_done || 0) + 1;
            
            await sb.from('profiles').update({ coins }).eq('user_id', userId);
            await sb.from('videos').update({ views_done: newViews }).eq('id', vidId);
            
            document.getElementById('coin-count').innerText = coins;
            tg.HapticFeedback.notificationOccurred('success');

            // 3. Логика перехода
            // Проверяем, нужно ли еще крутить это же видео или переходить
            if (newViews < vids[curr].views_needed) {
                vids[curr].views_done = newViews; // Обновляем локально
                // Не меняем curr, крутим это же видео еще раз
            } else {
                // Видео закончилось, удаляем из локального списка и идем к следующему
                vids.splice(curr, 1);
                if (curr >= vids.length) curr = 0;
            }

            // 4. Запускаем следующее видео автоматически через 2 секунды паузы
            if (vids.length > 0) {
                document.getElementById('status-text').innerText = "Загрузка следующего...";
                setTimeout(() => {
                    startWatching();
                }, 2000);
            } else {
                document.getElementById('status-text').innerText = "Все видео просмотрены!";
                document.getElementById('start-overlay').style.display = 'flex';
                document.getElementById('timer-box').style.display = 'none';
            }
        }

        async function createOrder() {
            const url = document.getElementById('yt-url').value;
            const vidId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
            const count = parseInt(document.getElementById('v-count').value);
            const price = count * 300;

            if (coins < price) return tg.showAlert("Недостаточно монет!");
            
            await sb.from('videos').insert([{
                youtube_id: vidId, views_needed: count, duration: 180, user_id: userId, views_done: 0
            }]);

            coins -= price;
            await sb.from('profiles').update({ coins }).eq('user_id', userId);
            tg.showAlert("Задание добавлено!");
            location.reload();
        }

        function tab(n, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + n).classList.add('active-page');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        window.onload = boot;
    </script>
</body>
</html>
