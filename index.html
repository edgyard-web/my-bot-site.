<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-bg: #1a1b1e; --primary: #0088cc; --gold: #ffeb3b; }
        body { background: var(--tg-bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .page { flex: 1; display: flex; flex-direction: column; padding: 15px; text-align: center; }
        
        /* Контейнер видео */
        .video-box { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; 
            overflow: hidden; position: relative; border: 2px solid #333; 
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Наложенная кнопка для старта (Разблокировка звука) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; cursor: pointer;
        }
        .play-btn { background: var(--primary); padding: 12px 25px; border-radius: 30px; font-weight: bold; }

        .timer-text { font-size: 40px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .hint { font-size: 12px; color: #888; margin-bottom: 10px; }
        
        .nav-bar { background: #111; display: flex; justify-content: space-around; padding: 15px 0 30px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<div class="header">
    <div>🤖 UVIEW PRO</div>
    <div style="color:var(--gold)">💰 <span id="coin-count">0</span></div>
</div>

<div class="page">
    <div id="video-container" class="video-box">
        <div id="player-placeholder"></div>
        
        <div id="start-overlay" class="overlay" onclick="activateVideo()">
            <div class="play-btn">▶ СМОТРЕТЬ (180 сек)</div>
            <div style="font-size: 10px; margin-top: 8px;">Звук включится автоматически</div>
        </div>
    </div>

    <div id="timer-display" style="display:none;">
        <div class="timer-text" id="seconds">180</div>
        <div class="hint">Не закрывайте приложение до конца таймера</div>
    </div>

    <div id="controls" style="margin-top: auto; display: flex; gap: 10px; padding-bottom: 20px;">
        <button onclick="location.reload()" style="flex:1; padding:15px; border-radius:10px; border:none; background:#333; color:white;">Пропустить ➡</button>
    </div>
</div>

<div class="nav-bar">
    <div style="color:var(--primary)">🏠 ЛЕНТА</div>
    <div onclick="tg.showAlert('Магазин будет доступен скоро')">🛒 МАГАЗИН</div>
</div>

<script>
    const S_URL = "https://itmwgzryoeeehymbyrdz.supabase.co", 
          S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0bXdnenJ5b2VlZWh5bWJ5cmR6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODY2NzcxNywiZXhwIjoyMDg0MjQzNzE3fQ.YJNdFs468N3vIqzvEfQPzg_jAGXsx-rN8YDMqQX793g", 
          sb = supabase.createClient(S_URL, S_KEY), tg = window.Telegram.WebApp;

    let userId = tg.initDataUnsafe?.user?.id?.toString() || "u_test", 
        vids = [], curr = 0, timeLeft = 180, timerId;

    async function boot() {
        tg.expand();
        let { data: p } = await sb.from('profiles').select('coins').eq('user_id', userId).single();
        document.getElementById('coin-count').innerText = p ? p.coins : 500;
        
        let { data: v } = await sb.from('videos').select('*');
        vids = (v || []).filter(item => (item.views_done || 0) < item.views_needed);
        
        if (vids.length === 0) {
            document.getElementById('start-overlay').innerHTML = "Видео закончились";
        }
    }

    function activateVideo() {
        if (vids.length === 0) return;

        const videoId = vids[curr].youtube_id;
        const container = document.getElementById('player-placeholder');
        
        // Вставляем iframe напрямую. 
        // allow="autoplay; accelerometer; encrypted-media" — КРИТИЧНО для звука и просмотров
        container.innerHTML = `
            <iframe 
                src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>`;

        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('timer-display').style.display = 'block';
        document.getElementById('controls').style.display = 'none';

        startTimer();
    }

    function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                finish();
            }
        }, 1000);
    }

    async function finish() {
        const currentCoins = parseInt(document.getElementById('coin-count').innerText);
        await sb.from('profiles').update({ coins: currentCoins + 150 }).eq('user_id', userId);
        await sb.from('videos').update({ views_done: (vids[curr].views_done || 0) + 1 }).eq('id', vids[curr].id);
        tg.showAlert("✅ Награда 150 монет получена!");
        location.reload();
    }

    window.onload = boot;
</script>

</body>
</html>
